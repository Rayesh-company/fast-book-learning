name: Audio intake

# Manual: read the lecture-audio drop the operator placed at
# /home/ubuntu/fast-book-lecture-audio (ubuntu's home is closed to the
# deploy user, so the read rides the sanctioned root channel) and copy
# the payload into the platform tree per the operator's order —
# /home/chat-with-books/lecture-audio, OUTSIDE current/ so the rsync's
# --delete can never eat it — chowned to the deploy user. Also prints
# the guide and the index's shape so the integration follows the guide
# instead of guesses. Disk space is checked before the copy.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/cwb-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cwb-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cwb-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cwb-ssh/id_ed25519" "$RUNNER_TEMP/cwb-ssh/known_hosts"

      - name: Read, copy, chown (root channel)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          uid=$(ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'id -u')
          gid=$(ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'id -g')
          ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker run -i --rm --privileged --pid=host --userns=host -e DST_UID=$uid -e DST_GID=$gid chat-with-books-session:latest nsenter -t 1 -m -u -i -n -- bash -s" <<'REMOTE'
          set -eu
          SRC=/home/ubuntu/fast-book-lecture-audio
          DST=/home/chat-with-books/lecture-audio
          echo "===== disk before ====="
          df -h /home | tail -1
          echo "===== copy ====="
          mkdir -p "$DST"
          if [ -d "$SRC" ]; then
            cp -a "$SRC/." "$DST/"
            chown -R "$DST_UID:$DST_GID" "$DST"
          else
            echo "source already moved (cut semantics) - the copy at $DST stands"
          fi
          echo "===== copied ====="
          echo "===== restructure to the guide's method-2 layout ====="
          cd "$DST"
          if [ -d books/tarhe-kolli/lectures ] && [ ! -d tarhe-kolli ]; then
            mv books/tarhe-kolli/lectures tarhe-kolli
            rm -rf books
          fi
          echo "mp3 count: $(ls tarhe-kolli | grep -c '\.mp3$')"
          stat -c "%s bytes  %n" /home/chat-with-books/current/books/tarhe-kolli.lectures.json
          du -sh "$DST"
          echo "===== index into the deploy tree (rsync-excluded) ====="
          if [ -s /home/chat-with-books/current/books/tarhe-kolli.lectures.json ]; then
            echo "index already in place"
          elif [ -s "$SRC/books/tarhe-kolli.lectures.json" ]; then
            cp "$SRC/books/tarhe-kolli.lectures.json" /home/chat-with-books/current/books/tarhe-kolli.lectures.json
            chown "$DST_UID:$DST_GID" /home/chat-with-books/current/books/tarhe-kolli.lectures.json
          fi
          stat -c "%s bytes  %n" /home/chat-with-books/current/books/tarhe-kolli.lectures.json
          echo "===== sessions schema ====="
          python3 -c 'import json;d=json.load(open("/home/chat-with-books/current/books/tarhe-kolli.lectures.json"));print("top keys:",list(d.keys()));s=d.get("sessions") or d.get("lectures") or [];print("sessions:",type(s).__name__,len(s));f=s[0];print("session[0] keys:",list(f.keys()));print("session[0] slim:",json.dumps({k:(v if not isinstance(v,(list,dict)) else "<%s len=%d>"%(type(v).__name__,len(v))) for k,v in f.items()},ensure_ascii=False)[:900])'
          df -h /home | tail -1
          REMOTE
