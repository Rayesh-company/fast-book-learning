name: Bernamek trace

# Manual: dump the session container's recent request log around the
# برنامک paths — WHO reached /eitaa, with WHICH status. The server logs
# request lines only (method + path + status), never bodies, so the
# dump is safe to print; reading it names the failing layer without
# guessing: no hits = Eita's WebView never reached us, 401s on
# /eitaa/auth = the signature layer, 200s = the platform is fine and
# the trouble is client-side.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/cwb-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cwb-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cwb-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cwb-ssh/id_ed25519" "$RUNNER_TEMP/cwb-ssh/known_hosts"

      - name: Recent requests around the برنامک
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'docker logs --since 7200 chat-with-books-session 2>&1 | grep -E "eitaa|TRACE" | tail -40; echo "--- any errors ---"; docker logs --since 7200 chat-with-books-session 2>&1 | grep -iE "traceback|error" | tail -10'
