name: Bernamek check

# The برنامک's self-test (manual, workflow_dispatch). It exists because
# 2026-10-20's hunt showed a 401 names only the symptom — "some token
# is set, wrongly" — and the failing LAYER stayed invisible: compose
# interpolates .env VALUES, so the panel's token (it carries
# `$iDmYpyQ`) reached the container amputated, and this machine cannot
# reliably read Actions logs to inspect anything. The token therefore
# rides as a raw-bytes FILE on the volume (EITAA_BOT_TOKEN_FILE), and
# this check verifies each layer through step CONCLUSIONS alone, every
# one readable from the jobs API:
#   layer 1 - the token file in the container matches the secret
#             (fingerprinted — the value itself is never printed: a
#             mangled stranger would sail past GitHub's masking
#             unmasked)
#   layer 2 - production validates a genuine signature
#             (the runner signs a fresh initData with the secret and
#             demands the 200 bound:false exchange)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/cwb-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cwb-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cwb-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cwb-ssh/id_ed25519" "$RUNNER_TEMP/cwb-ssh/known_hosts"

      - name: "layer 1: the token file in the container matches the secret"
        env:
          EITAA_BOT_TOKEN: ${{ secrets.EITAA_BOT_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          expected=$(printf '%s' "$EITAA_BOT_TOKEN" | python3 -c "import sys,hashlib; v=sys.stdin.read(); print(len(v), hashlib.sha256(v.encode()).hexdigest()[:16])")
          actual=$(ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'docker exec chat-with-books-session sh -c "cat /data/eitaa-bot-token 2>/dev/null || true" | python3 -c "import sys,hashlib; v=sys.stdin.read().strip(); print(len(v), hashlib.sha256(v.encode()).hexdigest()[:16] if v else \"(no file)\")"')
          echo "secret  : $expected"
          echo "file    : $actual"
          [ "$expected" = "$actual" ]

      - name: "layer 2: production validates a genuine signature"
        env:
          EITAA_BOT_TOKEN: ${{ secrets.EITAA_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, time, urllib.request, urllib.error
          from urllib.parse import urlencode
          import os

          token = os.environ["EITAA_BOT_TOKEN"]
          user = json.dumps({"id": 279058397, "first_name": "selftest",
                             "last_name": "", "language_code": "fa",
                             "allows_write_to_pm": True})
          pairs = [("auth_date", str(int(time.time()))),
                   ("chat_instance", "-3788475317572404878"),
                   ("chat_type", "private"), ("user", user)]
          check = "\n".join(f"{k}={v}" for k, v in sorted(pairs))
          secret = hmac.new(b"WebAppData", token.encode(), hashlib.sha256).digest()
          sig = hmac.new(secret, check.encode(), hashlib.sha256).hexdigest()
          body = json.dumps({"initData": urlencode(pairs) + "&hash=" + sig}).encode()
          req = urllib.request.Request(
              "https://booksai.rayesh-team.ir/eitaa/auth", data=body,
              headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  status, payload = r.status, json.loads(r.read())
          except urllib.error.HTTPError as exc:
              status, payload = exc.code, json.loads(exc.read())
          print(status, payload)
          assert status == 200 and payload.get("bound") is False, "the exchange refused a genuine signature - the server holds a stranger"
          PY
