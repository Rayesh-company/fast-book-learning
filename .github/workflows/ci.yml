name: CI

on:
  pull_request:
    branches: [2book-ingest]
  push:
    branches: [2book-ingest]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The narration tests speak through the isolated Node runtime the
      # reader's narration rides — the suite needs its dependencies on
      # disk (pdfjs-dist) exactly like a dev machine's.
      - name: Install the narration runtime
        working-directory: ui/narration
        run: npm ci

      # The page-raster and narration tests import pypdfium2 + Pillow;
      # the pins are the image's own (ui/Dockerfile).
      - name: Install development dependencies
        run: python -m pip install pytest pyyaml pypdfium2==5.9.0 "pillow>=10,<12"

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q

  reader:
    name: Reader (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/reader
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/reader/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  mobile:
    name: Mobile type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push'
    needs: [backend, reader, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # The pre-deploy guard reads the live entry over https: the
      # booksai 443 vhost took its Let's Encrypt cert on 2026-10-19
      # (the fix-tls workflow), so the strict check - valid cert, our
      # own origin - is the honest gate again.
      - name: Verify production endpoint
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          python - <<'PY'
          import os
          import socket
          addresses = {result[4][0] for result in socket.getaddrinfo(
              "booksai.rayesh-team.ir", 443, type=socket.SOCK_STREAM
          )}
          expected = os.environ["DEPLOY_HOST"]
          if addresses != {expected}:
              raise SystemExit(f"DNS for booksai.rayesh-team.ir is {sorted(addresses)}, expected {expected}")
          PY
          curl --fail --silent --show-error https://booksai.rayesh-team.ir/livez

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Export Android OTA bundle
        working-directory: mobile
        run: |
          mkdir -p ../.scratch
          npx expo export --platform android --output-dir ../.scratch/ota-export
        env:
          EXPO_PUBLIC_API_URL: https://booksai.rayesh-team.ir

      - name: Publish OTA payload
        run: python scripts/publish_ota.py .scratch/ota-export

      - name: Download session image wheels
        run: |
          mkdir -p ui/wheels
          python -m pip download --dest ui/wheels --only-binary=:all: \
            --platform manylinux_2_17_x86_64 --python-version 312 \
            --implementation cp --abi cp312 \
            pypdfium2==5.9.0 'pillow>=10,<12'

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/cwb-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cwb-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cwb-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cwb-ssh/id_ed25519" "$RUNNER_TEMP/cwb-ssh/known_hosts"

      # The برنامک's credential (ADR-0021) is deploy-managed — and it
      # NEVER rides the env layer: compose interpolates .env VALUES (an
      # undefined `$VAR` amputates silently, no escape exists there),
      # and the panel's token carries exactly such a `$iDmYpyQ`. So the
      # secret is written THROUGH the running container (docker exec,
      # no interpolation anywhere) onto the persisted volume as the
      # raw-bytes file EITAA_BOT_TOKEN_FILE points at; bot_token()
      # reads it per call — no restart needed for a rotation. The env
      # var in the box .env is scrubbed empty so the poisoned
      # interpolated value behind it can never win. The value rides
      # ssh stdin ONCE into a variable; it never hits a command line.
      - name: Ensure the برنامک token file in the container
        env:
          EITAA_BOT_TOKEN: ${{ secrets.EITAA_BOT_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          printf '%s' "$EITAA_BOT_TOKEN" | ssh -p "$DEPLOY_PORT" \
            -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" '
              set -eu
              token=$(cat)
              # The file lands on the volume through the container —
              # the deploy user holds docker, not root.
              printf "%s" "$token" | docker exec -i chat-with-books-session \
                sh -c "cat > /data/eitaa-bot-token && chmod 600 /data/eitaa-bot-token"
              # The env fallback dies: an interpolated stranger must
              # never sit behind the file for a future fallback to find.
              cd /home/chat-with-books/current
              if grep -q "^EITAA_BOT_TOKEN=.." .env 2>/dev/null; then
                sed -i "s/^EITAA_BOT_TOKEN=.*/EITAA_BOT_TOKEN=/" .env
              fi
              docker exec chat-with-books-session \
                sh -c "test -s /data/eitaa-bot-token && echo token-file-present"
            '

      # The SMS login's panel facts (2026-10-23, فراز اسمس): the box
      # .env is rsync-excluded, so the deploy upserts the values
      # itself — idempotent replace-or-append, SINGLE-QUOTED (the house
      # rule: compose interpolates .env values, quotes are the only
      # shield). The script is built in the runner (values substituted
      # into single-quoted positions once) and rides ssh STDIN — the
      # pattern the برنامک token step uses; nothing hits an argv or a
      # heredoc (the recorded workflow gotchas). The pattern variable
      # name rides along (the operator's pattern gKNR73mwli names its
      # code slot %codes% — not a secret, plain in the workflow).
      # compose recreates the session container with them; any unset
      # secret leaves the route at its honest 503.
      - name: Upsert the فراز اسمس facts into the box .env
        env:
          FARAZSMS_API_KEY: ${{ secrets.FARAZSMS_API_KEY }}
          FARAZSMS_PATTERN_CODE: ${{ secrets.FARAZSMS_PATTERN_CODE }}
          FARAZSMS_FROM_NUMBER: ${{ secrets.FARAZSMS_FROM_NUMBER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          remote_script="set -eu
          cd /home/chat-with-books/current
          touch .env
          upsert_val() {
            name=\"\$1\"; value=\"\$2\"
            if grep -q \"^\${name}=\" .env 2>/dev/null; then
              sed -i \"s|^\${name}=.*|\${name}='\${value}'|\" .env
            else
              printf '\n%s=%s\n' \"\$name\" \"'\${value}'\" >> .env
            fi
          }
          upsert_val FARAZSMS_API_KEY '$FARAZSMS_API_KEY'
          upsert_val FARAZSMS_PATTERN_CODE '$FARAZSMS_PATTERN_CODE'
          upsert_val FARAZSMS_FROM_NUMBER '$FARAZSMS_FROM_NUMBER'
          upsert_val FARAZSMS_PATTERN_PARAM 'codes'
          grep -c '^FARAZSMS_' .env"
          printf '%s' "$remote_script" | ssh -p "$DEPLOY_PORT" \
            -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s'

      - name: Sync source and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh_transport="ssh -p $DEPLOY_PORT -i $RUNNER_TEMP/cwb-ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/cwb-ssh/known_hosts -o ServerAliveInterval=15 -o ServerAliveCountMax=6"
          rsync -az --delete \
            -e "$ssh_transport" \
            --exclude='/.git/' \
            --exclude='/.scratch/' --exclude='/.venv/' \
            --exclude='/mobile/' --exclude='*.apk' --exclude='*.aab' \
            --exclude='**/__pycache__/' --exclude='*.pyc' --exclude='.pytest_cache/' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='/books/*.pdf' \
            --exclude='/books/*.lectures.json' \
            --exclude='/books/*/lectures/' \
            --exclude='*.mp3' \
            --exclude='/render-cache/' \
            --exclude='ui/*.sqlite3' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/home/chat-with-books/current/"
          ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=6 "${DEPLOY_USER}@${DEPLOY_HOST}" 'set -e; cd /home/chat-with-books/current; test -s .env; test -s books/tarhe-kolli.pdf; test -s books/70143-336.pdf; docker compose -p chat-withbooks -f compose.yaml -f compose.production.yaml --profile session pull postgres cognee cognee-next-tier || echo "registry pull skipped — building from the images already on the box"; docker compose -p chat-withbooks -f compose.yaml -f compose.production.yaml --profile session up -d --build; for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8765/livez >/dev/null && exit 0; sleep 2; done; echo "Session UI did not become healthy" >&2; exit 1'
