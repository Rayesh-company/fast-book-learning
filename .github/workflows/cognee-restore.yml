name: Cognee restore inspect

# Manual: diagnose the corpus and the live search. The vector data IS
# present (DocumentChunk_text 341 rows beside the graph) yet /ask's pool
# is empty — so the probe now hits cognee DIRECTLY on the box with the
# exact payload ui/ask.py sends (searchType HYBRID_COMPLETION,
# only_context) and prints the HTTP status, the reply's head, and
# cognee's recent error lines: the failing lane named by cognee itself.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/cwb-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cwb-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cwb-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cwb-ssh/id_ed25519" "$RUNNER_TEMP/cwb-ssh/known_hosts"

      - name: Probe cognee directly with the ask's own payload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -eu
          echo "== direct cognee probe =="
          code=$(curl -s -m 60 -o /tmp/probe.json -w '%{http_code}' \
            -X POST http://127.0.0.1:18000/api/v1/recall \
            -H 'Content-Type: application/json' \
            -d '{"searchType":"HYBRID_COMPLETION","query":"قرآن","datasets":["tarhe-kolli"],"includeReferences":true,"only_context":true}')
          echo "http $code"
          head -c 500 /tmp/probe.json; echo
          rm -f /tmp/probe.json
          echo "== cognee recent errors =="
          docker logs --since 3600 chat-with-books-cognee 2>&1 | grep -iE "error|exception|traceback|dimension" | tail -12 || echo "(none)"
          REMOTE
