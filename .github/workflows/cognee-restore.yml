name: Cognee restore inspect

# Manual: diagnose the corpus — where the vectors actually live. The
# graph survived the migration (18k edges) but no vector-bearing table
# sits in public; this probe lists every database, every vector-columned
# table in any schema, and the schema census, so the restore plan rests
# on the cluster's own facts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/cwb-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cwb-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cwb-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cwb-ssh/id_ed25519" "$RUNNER_TEMP/cwb-ssh/known_hosts"

      - name: Where do the vectors live
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -eu
          P=chat-with-books-postgres
          U=$(docker exec $P printenv POSTGRES_USER)
          D=$(docker exec $P printenv POSTGRES_DB)
          echo "== databases =="
          docker exec $P psql -U "$U" -d "$D" -tAc "SELECT datname FROM pg_database WHERE NOT datistemplate"
          echo "== vector-bearing tables, any schema =="
          docker exec $P psql -U "$U" -d "$D" -tAc "SELECT table_schema || '.' || table_name || ' : ' || (xpath('/row/c/text()', query_to_xml(format('SELECT count(*) AS c FROM %I.%I', table_schema, table_name), false, true, '')))[1]::text FROM information_schema.columns WHERE udt_name='vector' ORDER BY 1"
          echo "== schema census =="
          docker exec $P psql -U "$U" -d "$D" -tAc "SELECT n.nspname || ' : ' || count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind='r' AND n.nspname NOT IN ('pg_catalog','information_schema') GROUP BY 1 ORDER BY 1"
          REMOTE
