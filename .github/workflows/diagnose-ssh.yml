name: Diagnose SSH Auth

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Probe SSH auth methods
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          for u in ubuntu root cwb-deploy chat-with-books; do
            echo "=== Testing $u ==="
            sshpass -p "$VPS_PASSWORD" ssh -p "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=no \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              -o ConnectTimeout=10 \
              "$u@${DEPLOY_HOST}" "id; whoami" || echo "$u failed with exit code $?"
          done
