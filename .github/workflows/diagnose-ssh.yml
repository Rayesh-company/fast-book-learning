name: Diagnose SSH Auth

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Probe usernames on port 22
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          for u in ubuntu root amir rayesh admin debian cwb-deploy fastbook; do
            echo "--- Testing $u ---"
            sshpass -p "$VPS_PASSWORD" ssh -p 22 \
              -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
              -o PreferredAuthentications=password \
              "$u@193.93.169.177" "id; whoami" && echo "SUCCESS FOR $u!" && exit 0 || echo "Failed for $u"
          done
