name: Diagnose SSH Auth

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Probe SSH auth methods
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          echo "=== Testing ubuntu ==="
          sshpass -p "$VPS_PASSWORD" ssh -v -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=10 \
            "ubuntu@${DEPLOY_HOST}" "id; whoami" || echo "ubuntu failed with exit code $?"

          echo "=== Testing root ==="
          sshpass -p "$VPS_PASSWORD" ssh -v -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=10 \
            "root@${DEPLOY_HOST}" "id; whoami" || echo "root failed with exit code $?"
