name: Env check
on:
  workflow_dispatch:
    inputs:
      script_b64:
        description: 'Base64 encoded script to run on VPS'
        required: false
        default: ''
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Run VPS diagnostics
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          TARGET_USER: "ubuntu"
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          SCRIPT_B64: ${{ inputs.script_b64 }}
        run: |
          set -eu
          echo "Connecting to VPS on port $DEPLOY_PORT as $TARGET_USER..."
          if [ -n "$SCRIPT_B64" ]; then
            echo "$SCRIPT_B64" | base64 -d | sshpass -p "$VPS_PASSWORD" ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 "${TARGET_USER}@${DEPLOY_HOST}" 'bash -s'
          else
            echo "No SCRIPT_B64 provided."
          fi
