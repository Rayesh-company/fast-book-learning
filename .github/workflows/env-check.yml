name: Env check
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Run VPS diagnostics
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          TARGET_USER: "ubuntu"
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -eu
          echo "Connecting to VPS on port $DEPLOY_PORT as $TARGET_USER..."
          echo "" | base64 -d | sshpass -p "$VPS_PASSWORD" ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 "${TARGET_USER}@${DEPLOY_HOST}" 'bash -s'
