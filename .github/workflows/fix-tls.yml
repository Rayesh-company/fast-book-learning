name: Fix TLS

# One manual job (workflow_dispatch): give booksai.rayesh-team.ir its
# 443 back. The migration to this box left the domain with no TLS
# server block, so https:// falls through to the neighbor vhost and
# serves ANOTHER PRODUCT under our name — and the mobile app's baked
# https:// EXPO_PUBLIC_API_URL plus the Eita برنامک's registered URL
# are unusable until it holds. The channel is the deploy's own: the
# box's sshd on DEPLOY_PORT, the deploy key, StrictHostKeyChecking
# against DEPLOY_KNOWN_HOSTS.
#
# STEP 1 diagnoses who owns 443 (host nginx vs a proxy container) and
# what the deploy user may touch — 2026-10-19's first run stopped at
# `sudo: a password is required`, so this step names the real owner
# before anything is attempted. STEP 2 is the gated repair: the cert
# is issued only through the port-80 webroot the vhost already
# serves, the vhost file is backed up before it is overwritten,
# nginx's config test gates the reload, and a reload never restarts
# the service — the neighbor's vhosts are never touched.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls:
    name: Diagnose 443, issue cert, install the booksai vhost
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/cwb-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cwb-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cwb-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cwb-ssh/id_ed25519" "$RUNNER_TEMP/cwb-ssh/known_hosts"

      - name: Diagnose who owns 443
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          echo "== who am I / what may I sudo =="
          id
          sudo -n -l 2>&1 | head -8
          echo "== listeners on 80/443 =="
          (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep -E ':(80|443)\b' || echo "none visible"
          echo "== host nginx readable? =="
          ls -la /etc/nginx 2>&1 | head -12
          echo "== booksai inside /etc/nginx (errors shown) =="
          grep -rl "booksai" /etc/nginx 2>&1 | head -10
          echo "== all containers =="
          docker ps --format '{{.Names}}\t{{.Image}}\t{{.Ports}}' 2>&1
          echo "== proxy-ish containers and their mounts =="
          for c in $(docker ps --format '{{.Names}}' | grep -iE 'nginx|proxy|traefik|caddy|hemmat' || true); do
            echo "--- $c"
            docker port "$c" 2>&1 | head -5
            docker inspect "$c" --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' 2>&1
          done
          echo "== plausible proxy config dirs =="
          ls -la /srv 2>&1 | head -8
          ls -la /opt 2>&1 | head -8
          REMOTE

      - name: Issue the cert and install the vhost (needs the rights step 1 names)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -eu
          target=""
          for dir in /etc/nginx/sites-enabled /etc/nginx/conf.d; do
            if [ -z "$target" ]; then
              target=$(grep -rl "booksai.rayesh-team.ir" "$dir" 2>/dev/null | head -1 || true)
            fi
          done
          if [ -z "$target" ]; then
            echo "no booksai vhost found - planting a fresh one at /etc/nginx/conf.d/booksai.conf"
            target=/etc/nginx/conf.d/booksai.conf
          fi
          echo "vhost file: $target"
          if sudo -n test -s /etc/letsencrypt/live/booksai.rayesh-team.ir/fullchain.pem 2>/dev/null; then
            echo "booksai cert already present - keeping it"
          else
            echo "issuing the booksai cert through the port-80 webroot"
            sudo -n certbot certonly --webroot -w /var/www/html \
              -d booksai.rayesh-team.ir \
              --non-interactive --agree-tos --keep-until-expiring \
              --register-unsafely-without-email
          fi
          echo "== install the vhost (backed up first) =="
          sudo -n cp "$target" "$target.bak-$(date +%s)"
          sudo -n cp "/srv/chat-with-books/current/ops/nginx/booksai.conf" "$target"
          echo "== nginx -t gates the reload =="
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          echo "== verify from the box =="
          curl -fsS https://booksai.rayesh-team.ir/livez && echo " <- livez over https"
          curl -fsS -o /dev/null -w "sheet over https: %{http_code}\n" https://booksai.rayesh-team.ir/
          REMOTE

      - name: Verify from the runner
        run: |
          curl -fsS https://booksai.rayesh-team.ir/livez && echo " <- livez over https"
          echo | openssl s_client -connect "${{ secrets.DEPLOY_HOST }}:443" \
            -servername booksai.rayesh-team.ir 2>/dev/null | openssl x509 -noout -subject -dates
