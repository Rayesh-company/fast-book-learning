name: Fix TLS

# One manual job (workflow_dispatch): give booksai.rayesh-team.ir its
# 443 back. The migration to this box left the domain with no TLS
# server block, so https:// falls through to the neighbor vhost and
# serves ANOTHER PRODUCT under our name — and the mobile app's baked
# https:// EXPO_PUBLIC_API_URL plus the Eita برنامک's registered URL
# are unusable until it holds.
#
# The channel: the deploy's own ssh (DEPLOY_PORT + DEPLOY_KEY +
# DEPLOY_KNOWN_HOSTS). The 2026-10-19 diagnostic proved the deploy
# user holds NO sudo (nginx/certbot are root-owned, the proxy is the
# HOST nginx — no proxy container exists), and the PM then sanctioned
# the docker path explicitly: the deploy user holds the docker group,
# and nsenter into PID 1's namespaces from a privileged throwaway
# container — the standard, documented way a docker principal acts on
# the host — runs the SAME gated runbook as host root: keep-or-issue
# the cert through the port-80 webroot, back up the vhost, install
# the synced 80+443 config, let `nginx -t` gate the reload (restoring
# the backup INSTEAD of reloading if the test fails). A reload never a
# restart; the neighbor's vhosts are never opened.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls:
    name: Issue cert and install the booksai 443 vhost
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/cwb-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cwb-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cwb-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cwb-ssh/id_ed25519" "$RUNNER_TEMP/cwb-ssh/known_hosts"

      - name: Issue the cert and install the vhost (docker-nsenter, gated)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -eu
          CONF=/srv/chat-with-books/current/ops/nginx/booksai.conf
          VHOST=/etc/nginx/sites-available/booksai.conf
          test -s "$CONF"
          test -f "$VHOST"
          # The escape vehicle is the box's own session image (a
          # Debian-slim base: nsenter rides util-linux, essential in
          # Debian) — nothing is pulled, nothing new lands on the box.
          docker run -i --rm --privileged --pid=host --userns=host \
            chat-with-books-session:latest \
            nsenter -t 1 -m -u -i -n -- bash -s <<'REPAIR'
          set -eu
          echo "== host root check =="
          [ "$(id -u)" = "0" ]
          CONF=/srv/chat-with-books/current/ops/nginx/booksai.conf
          VHOST=/etc/nginx/sites-available/booksai.conf
          test -s "$CONF"
          test -f "$VHOST"
          echo "== the cert =="
          if [ -s /etc/letsencrypt/live/booksai.rayesh-team.ir/fullchain.pem ]; then
            echo "booksai cert already present - keeping it"
          else
            certbot certonly --webroot -w /var/www/html \
              -d booksai.rayesh-team.ir \
              --non-interactive --agree-tos --keep-until-expiring \
              --register-unsafely-without-email
          fi
          echo "== install the vhost (backed up first) =="
          bak="$VHOST.bak-$(date +%s)"
          cp "$VHOST" "$bak"
          cp "$CONF" "$VHOST"
          echo "== the renewal deploy hook (a renewed cert must reach nginx) =="
          # This cert was issued certonly --webroot: installer NONE, so
          # a January renewal would land on disk while nginx kept
          # serving the expiring one from memory. The deploy hook runs
          # after EVERY renewal and reloads — idempotent to re-install.
          mkdir -p /etc/letsencrypt/renewal-hooks-deploy
          printf '#!/bin/sh\nsystemctl reload nginx\n' \
            > /etc/letsencrypt/renewal-hooks-deploy/reload-nginx.sh
          chmod +x /etc/letsencrypt/renewal-hooks-deploy/reload-nginx.sh
          certbot renew --cert-name booksai.rayesh-team.ir --dry-run \
            || echo "dry-run failed/skipped (informational only - network to LE staging)"
          echo "== nginx -t gates the reload =="
          if nginx -t 2>&1; then
            systemctl reload nginx
            echo "nginx reloaded"
          else
            echo "nginx -t FAILED - restoring the backup, NO reload"
            cp "$bak" "$VHOST"
            nginx -t
            exit 1
          fi
          echo "== verify from the box =="
          curl -fsS https://booksai.rayesh-team.ir/livez && echo " <- livez over https"
          REPAIR
          REMOTE

      - name: Verify from the runner
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://booksai.rayesh-team.ir/livez)
          echo "http livez -> $code (301 expected)"
          [ "$code" = "301" ]
          curl -fsS https://booksai.rayesh-team.ir/livez && echo " <- livez over https"
          echo | openssl s_client -connect "${{ secrets.DEPLOY_HOST }}:443" \
            -servername booksai.rayesh-team.ir 2>/dev/null | openssl x509 -noout -subject -dates
