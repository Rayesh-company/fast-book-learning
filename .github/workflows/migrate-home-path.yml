name: Migrate deploy tree

# One-shot (workflow_dispatch): move the deploy tree to
# /home/chat-with-books per the operator's call — the platform's own
# name under /home. /home is root-owned and the deploy user holds
# docker but not sudo, so the root act — rename-or-create + chown —
# rides the sanctioned nsenter channel; everything after runs as the
# deploy user. The first run copied the tree to a misnamed /home/path;
# this run relocates it to the right name and carries the two things
# rsync deliberately never carries (the box's own .env and the
# customer PDFs) if they were not already carried. The old /srv tree
# stands untouched as the rollback until the new path has served a
# deploy.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/cwb-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cwb-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cwb-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cwb-ssh/id_ed25519" "$RUNNER_TEMP/cwb-ssh/known_hosts"

      - name: Relocate the tree to /home/chat-with-books (root, rename or create)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          uid=$(ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'id -u')
          gid=$(ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'id -g')
          echo "deploy user: $uid:$gid"
          ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker run -i --rm --privileged --pid=host --userns=host chat-with-books-session:latest nsenter -t 1 -m -u -i -n -- bash -c 'if [ -d /home/path ]; then mv /home/path /home/chat-with-books; else mkdir -p /home/chat-with-books/current; fi; chown ${uid}:${gid} /home/chat-with-books; ls -ld /home /home/chat-with-books'"

      - name: Verify the tree (env and books included)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" '
              set -eu
              if [ ! -s /home/chat-with-books/current/.env ]; then
                cp -a /srv/chat-with-books/current/. /home/chat-with-books/current/
              fi
              test -s /home/chat-with-books/current/.env
              test -s /home/chat-with-books/current/books/tarhe-kolli.pdf
              test -s /home/chat-with-books/current/books/70143-336.pdf
              test -d /home/chat-with-books/current/ops/nginx
              test -d /home/chat-with-books/current/ui
              echo "tree verified at /home/chat-with-books/current"
              du -sh /home/chat-with-books/current
            '
