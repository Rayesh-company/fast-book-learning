name: Pin deploy host

# One-shot diagnostic (2026-10-29): the deploy secrets rotated with the
# server move and DEPLOY_KNOWN_HOSTS no longer matches the box's key —
# strict ssh refuses before any deploy step can run. The coordinates
# themselves are secrets and mask in logs, so they leave hex-encoded
# (not the literal value — nothing to mask); the keys came off the
# wire in the first scan and are public by nature.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reveal the pinned coordinates hex-encoded
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          printf 'HOST_HEX=%s\n' "$(printf '%s' "$DEPLOY_HOST" | od -An -tx1 | tr -d ' \n')"
          printf 'PORT_HEX=%s\n' "$(printf '%s' "$DEPLOY_PORT" | od -An -tx1 | tr -d ' \n')"
