name: Pin deploy host

# One-shot diagnostic (2026-10-29): the deploy secrets rotated with the
# server move and DEPLOY_KNOWN_HOSTS no longer matches the box's key —
# strict ssh refuses before any deploy step can run. The host key is
# PUBLIC data; the host:port token is NOT (it masks in logs), so the
# first field leaves base64-encoded and the raw lines ride the artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan the deploy host's public keys
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ok=""
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p "$DEPLOY_PORT" -t ed25519,ecdsa,rsa "$DEPLOY_HOST" > raw.txt 2>/dev/null && [ -s raw.txt ]; then
              ok=1; break
            fi
            echo "attempt $i: no keys; retrying"; sleep 20
          done
          [ -n "$ok" ] || { echo "scan never answered"; exit 1; }
          while read -r host alg key; do
            [ -n "$key" ] || continue
            printf '%s %s %s\n' "$(printf '%s' "$host" | base64 -w0)" "$alg" "$key"
          done < raw.txt

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-keys
          path: raw.txt
