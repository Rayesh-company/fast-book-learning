name: Pin deploy host

# One-shot diagnostic (2026-10-29): classify the ssh path to the rebuilt
# box. sshd may still be socket-activated on 22 even though the deploy
# port is 6041 — this tries BOTH ports with the deploy key and annotates
# each verdict (refused = reached the box, nobody listening; timeout =
# filtered on the way; SSH_OK = the way in).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe both ssh ports and annotate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/cwb-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cwb-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cwb-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cwb-ssh/id_ed25519" "$RUNNER_TEMP/cwb-ssh/known_hosts"
          for PORT in 22 "$DEPLOY_PORT"; do
            OUT="$(ssh -p "$PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
              -o ConnectTimeout=8 "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'echo SSH_OK' 2>&1 | grep -E "SSH_OK|refused|timed out|denied" | tail -1)"
            echo "::warning title=ssh-probe::PORT=$PORT | ${OUT:-no-answer}"
          done
