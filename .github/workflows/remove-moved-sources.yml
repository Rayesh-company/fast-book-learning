name: Remove moved sources

# One-shot (workflow_dispatch): the operator asked for cut-and-paste
# semantics, not copy-and-paste. Two sources outlived their moves:
# /home/ubuntu/fast-book-lecture-audio (the lecture drop's original)
# and /srv/chat-with-books (the pre-migration deploy tree). The root
# channel removes them — but ONLY after every destination proves
# itself: the 28 sessions at lecture-audio, the dump in backups, the
# index and the env inside current. Any failed check aborts before a
# single deletion.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/cwb-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cwb-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cwb-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cwb-ssh/id_ed25519" "$RUNNER_TEMP/cwb-ssh/known_hosts"

      - name: Verify the destinations, then remove the sources (root)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/cwb-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/cwb-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker run -i --rm --privileged --pid=host --userns=host chat-with-books-session:latest nsenter -t 1 -m -u -i -n -- bash -s" <<'REMOTE'
          set -eu
          echo "===== destinations prove themselves first ====="
          mp3s=$(ls /home/chat-with-books/lecture-audio/tarhe-kolli | grep -c '\.mp3$') || mp3s=0
          echo "mp3 count: $mp3s (need 28)"
          test "$mp3s" -eq 28
          echo "dump:"; stat -c "%s bytes  %n" /home/chat-with-books/backups/cognee_db.dump
          echo "index:"; stat -c "%s bytes  %n" /home/chat-with-books/current/books/tarhe-kolli.lectures.json
          echo "pdf:"; stat -c "%s bytes  %n" /home/chat-with-books/current/books/tarhe-kolli.pdf
          echo "env:"; stat -c "%s bytes  %n" /home/chat-with-books/current/.env
          test -s /home/chat-with-books/backups/cognee_db.dump
          test -s /home/chat-with-books/current/books/tarhe-kolli.lectures.json
          test -s /home/chat-with-books/current/books/tarhe-kolli.pdf
          test -s /home/chat-with-books/current/.env
          echo "all destinations hold their data"
          echo "===== remove the moved sources ====="
          rm -rf /home/ubuntu/fast-book-lecture-audio
          rm -rf /srv/chat-with-books
          echo "===== after ====="
          ls /home/ubuntu/
          ls /srv/ 2>/dev/null || echo "(srv empty or gone)"
          df -h /home | tail -1
          REMOTE
