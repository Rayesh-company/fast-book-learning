services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: chat-with-books-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cognee
      POSTGRES_PASSWORD: cognee
      POSTGRES_DB: cognee_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognee -d cognee_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cognee-network

  cognee:
    image: cognee/cognee:main
    container_name: chat-with-books-cognee
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: cognee
      DB_PASSWORD: cognee
      DB_NAME: cognee_db
      DB_PROVIDER: postgres
      VECTOR_DB_PROVIDER: pgvector
      GRAPH_DATABASE_PROVIDER: postgres_demo
      CACHE_BACKEND: postgres
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-custom}
      LLM_MODEL: ${LLM_MODEL:-openai/glm-5.3-flash}
      # Chat routes through AvalAI since 2026-09-13 — the Z.AI coding-plan
      # weekly quota was exhausted (error 1310, reset 2026-09-15 17:06).
      # AvalAI carries the GLM family; the key rides .env as LLM_API_KEY.
      LLM_ENDPOINT: ${LLM_ENDPOINT:-https://api.avalai.ir/v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      # The embedder is frozen into the ingested pgvector tables — a
      # stack whose data predates ADR 0004 pins small/1536 in .env
      # (README, VPS deploy).
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-https://api.avalai.ir/v1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-"3072"}
      EMBEDDING_BATCH_SIZE: "32"
      EMBEDDING_RATE_LIMIT_ENABLED: "true"
      EMBEDDING_RATE_LIMIT_REQUESTS: "120"
      EMBEDDING_RATE_LIMIT_INTERVAL: "60"
      LLM_RATE_LIMIT_ENABLED: "true"
      LLM_RATE_LIMIT_REQUESTS: "240"
      LLM_RATE_LIMIT_INTERVAL: "60"
      LLM_MIN_RETRY_ATTEMPTS: "6"
      LLM_MIN_RETRY_SECONDS: "1800"
      LLM_EXTRACTION_PROVIDER: ${LLM_EXTRACTION_PROVIDER:-${LLM_PROVIDER:-custom}}
      LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-${LLM_MODEL:-openai/glm-5.3-flash}}
      LLM_EXTRACTION_ENDPOINT: ${LLM_EXTRACTION_ENDPOINT:-${LLM_ENDPOINT:-https://api.avalai.ir/v1}}
      LLM_EXTRACTION_API_KEY: ${LLM_EXTRACTION_API_KEY:-${EMBEDDING_API_KEY}}
      LLM_SUMMARIZATION_PROVIDER: ${LLM_SUMMARIZATION_PROVIDER:-${LLM_PROVIDER:-custom}}
      LLM_SUMMARIZATION_MODEL: ${LLM_SUMMARIZATION_MODEL:-${LLM_MODEL:-openai/glm-5.3-flash}}
      LLM_SUMMARIZATION_ENDPOINT: ${LLM_SUMMARIZATION_ENDPOINT:-${LLM_ENDPOINT:-https://api.avalai.ir/v1}}
      LLM_SUMMARIZATION_API_KEY: ${LLM_SUMMARIZATION_API_KEY:-${EMBEDDING_API_KEY}}
      LLM_ANSWER_STREAMING: "true"
    volumes:
      - cognee_data:/cognee-storage/data
      - cognee_system:/cognee-storage/system
      - ./docker/enable_farsi_evidence.py:/enable_farsi_evidence.py:ro
    entrypoint: ["python", "/enable_farsi_evidence.py"]
    ports:
      - "18000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cognee-network

  cognee-next-tier:
    image: cognee/cognee:main
    container_name: chat-with-books-cognee-next-tier
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cognee:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: cognee
      DB_PASSWORD: cognee
      DB_NAME: cognee_db
      DB_PROVIDER: postgres
      VECTOR_DB_PROVIDER: pgvector
      GRAPH_DATABASE_PROVIDER: postgres_demo
      CACHE_BACKEND: postgres
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-custom}
      LLM_MODEL: ${LLM_MODEL:-openai/glm-5.3-flash}
      # Same AvalAI routing as cognee (2026-09-13, quota exhaustion).
      LLM_ENDPOINT: ${LLM_ENDPOINT:-https://api.avalai.ir/v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      # The embedder is frozen into the ingested pgvector tables — a
      # stack whose data predates ADR 0004 pins small/1536 in .env
      # (README, VPS deploy).
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-https://api.avalai.ir/v1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-"3072"}
      EMBEDDING_BATCH_SIZE: "8"
      EMBEDDING_RATE_LIMIT_ENABLED: "true"
      EMBEDDING_RATE_LIMIT_REQUESTS: "8"
      EMBEDDING_RATE_LIMIT_INTERVAL: "60"
      LLM_RATE_LIMIT_ENABLED: "true"
      LLM_RATE_LIMIT_REQUESTS: "60"
      LLM_RATE_LIMIT_INTERVAL: "60"
      LLM_MIN_RETRY_ATTEMPTS: "6"
      LLM_MIN_RETRY_SECONDS: "1800"
    volumes:
      - cognee_data:/cognee-storage/data
      - cognee_system:/cognee-storage/system
      - ./docker/enable_farsi_evidence.py:/enable_farsi_evidence.py:ro
    entrypoint: ["python", "/enable_farsi_evidence.py"]
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cognee-network

  agent:
    build: ./agent
    image: chat-with-books-agent:latest
    container_name: chat-with-books-agent
    profiles:
      - session
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The generated server's own dials: 4111 in-container, all
      # interfaces, the LibSQL thread store on the persisted volume.
      PORT: "4111"
      MASTRA_HOST: 0.0.0.0
      MASTRA_STORAGE_URL: file:/data/mastra.sqlite
      MASTRA_DUCKDB_PATH: /data/mastra-observability.duckdb
      # deepseek-v4.1-flash via Avalai (ADR-0018); the key rides the
      # same root-.env LLM_API_KEY the cognee services read.
      CHAT_AGENT_MODEL: ${CHAT_AGENT_MODEL:-avalai/deepseek-v4.1-flash}
      AVALAI_API_KEY: ${AVALAI_API_KEY:-${LLM_API_KEY}}
      AVALAI_BASE_URL: ${AVALAI_BASE_URL:-${LLM_ENDPOINT:-https://api.avalai.ir/v1}}
      AVALAI_SEARCH_TOOL: ${AVALAI_SEARCH_TOOL:-perplexity-search}
      # The Book pool rides the session service's /agent/recall seam
      # (ADR-0016/0018), container-to-container.
      PYTHON_CORE_URL: http://session:8765
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      MASTRA_STUDIO_PATH: /app/.mastra/output/studio
    ports:
      - "${AGENT_STUDIO_PORT:-127.0.0.1:4112}:4111"
    volumes:
      # The agent's conversation memory (durable threads, ADR-0014's
      # persistence leg) — a rebuild must not throw it away.
      - agent_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4111/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cognee-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  session:
    build:
      context: ./ui
      args:
        NARRATION_WITH_ALIGNMENT: ${NARRATION_WITH_ALIGNMENT:-0}
    image: chat-with-books-session:latest
    container_name: chat-with-books-session
    profiles:
      - session
    restart: unless-stopped
    depends_on:
      cognee:
        condition: service_healthy
      cognee-next-tier:
        condition: service_healthy
    env_file:
      - .env
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      # The composer (picker, phase-2 writer, dive calls) builds its URL
      # from LLM_ENDPOINT — routed to AvalAI with the services above
      # (2026-09-13, Z.AI quota exhaustion). Its default fallback in
      # composer.py stays the Z.AI coding endpoint.
      LLM_ENDPOINT: ${LLM_ENDPOINT:-https://api.avalai.ir/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/glm-5.3-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-"3072"}
      FROZEN_EMBEDDING_MODEL: ${FROZEN_EMBEDDING_MODEL:-${EMBEDDING_MODEL:-text-embedding-3-large}}
      FROZEN_EMBEDDING_DIMENSIONS: ${FROZEN_EMBEDDING_DIMENSIONS:-${EMBEDDING_DIMENSIONS:-"3072"}}
      # Independent Book narration: credentials remain server-side.
      AVALAI_TTS_API_KEY: ${AVALAI_TTS_API_KEY:-}
      AVALAI_API_KEY: ${AVALAI_API_KEY:-}
      AVALAI_API_BASE_URL: ${AVALAI_API_BASE_URL:-}
      NARRATION_ALIGNMENT_MODEL: /models/alignment/model_quantized.onnx
      COGNEE_URL: http://cognee:8000
      # The next-tier service listens on its CONTAINER port 8000 — 8001 is
      # only the host publish.
      NEXT_TIER_URL: http://cognee-next-tier:8000
      # A Next-tier search can pass ten minutes; the relay waits on its
      # own leash (serve.py default 1200s).
      NEXT_TIER_TIMEOUT: ${NEXT_TIER_TIMEOUT:-1200}
      IN_DOCKER: "1"
      SESSION_UI_HOST: 0.0.0.0
      SESSION_UI_PORT: "8765"
      SESSION_UI_QUOTA_DB: /data/usage.sqlite3
      DAILY_CHAT_LIMIT: 
      UNLIMITED_ACCOUNTS: 
      # The Account store (ADR-0013) persists beside the quota counts on
      # the same volume — a container rebuild must not throw the issued
      # Accounts away.
      ACCOUNTS_DB: /data/accounts.sqlite3
      # The login tokens are signed with AUTH_SECRET (ADR-0013); it rides
      # the compose-only .env like the keys above — unset, the server
      # generates a per-process secret and warns that a restart logs
      # every Account out.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # The Mastra chat agent's seam token (ADR-0016/0018): the agent
      # service presents it on /agent/recall's X-Agent-Token header.
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      # The Learner-facing seam's upstream (ADR-0018): the agent
      # service's generate route, container-to-container.
      AGENT_URL: http://agent:4111
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-240}
      # Research Mode's sessions persist beside the quota counts on the
      # same volume (ADR-0008) — a container rebuild must not throw an
      # in-progress investigation away.
      SESSION_RESEARCH_DB: /data/research.sqlite3
      # The usage ledger (T22, GitLab #24): the Account's spend entries on
      # the same persisted volume, and the tariff dials — Toman per million
      # tokens, config-held so a price change is an .env edit + restart,
      # never a code deploy. The defaults are the PM's starting numbers.
      LEDGER_DB: /data/usage_ledger.sqlite3
      TARIFF_INPUT_TOMAN_PER_MTOK: ${TARIFF_INPUT_TOMAN_PER_MTOK:-2000}
      TARIFF_OUTPUT_TOMAN_PER_MTOK: ${TARIFF_OUTPUT_TOMAN_PER_MTOK:-8000}
      # The admin audit log (T25, GitLab #26): the append-only record of
      # the Admin's actions, on the same persisted volume — an audit
      # that evaporates on a container rebuild is not an audit.
      AUDIT_DB: /data/audit.sqlite3
      # The first Admin from config (T26, GitLab #28): the bootstrap
      # seed command is retired — the deployment plants the PM's
      # Account once at startup, audited, and a restart never touches a
      # standing Admin. Set both in the compose-only .env; leave them
      # unset and the server comes up with no Admin, refusing every
      # console and issuance path until the PM plants one.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The Session store (T27 stage 3, GitLab #40): the Accounts' نشست
      # history on the same persisted volume — a container rebuild must
      # not throw a sitting's transcript away.
      SESSIONS_DB: /data/sessions.sqlite3
      # The ask chat store (ADR-0014): the reload's restore row -
      # question, pool, Quote selection, Quoted answer - on the same
      # persisted volume, beside the research store it mirrors.
      SESSION_CHAT_DB: /data/chats.sqlite3
      # The Notebook store (the selection map, ticket 08): the
      # researcher's یادداشت‌ها on the same persisted volume — without
      # this the notes land in /app inside the container and every
      # image rebuild throws them away.
      NOTES_DB: /data/notes.sqlite3
      # The Eita binding store (ADR-0021): the برنامک's eita-user ↔
      # Account links on the same persisted volume — a rebuild must
      # not cut every Eita user off their Account and back to the
      # login door.
      EITAA_DB: /data/eitaa.sqlite3
      # The SMS login (2026-10-23, فراز اسمس): the panel's facts ride
      # the compose .env like every other credential (webservice:
      # api.iranpayamak.com, Api-Key header); any of the three unset,
      # /auth/otp/request answers the honest 503 while the waitlist
      # fork keeps working. The waitlist itself (phones with no
      # Account) persists on the same volume as the Accounts.
      FARAZSMS_API_KEY: ${FARAZSMS_API_KEY:-}
      FARAZSMS_PATTERN_CODE: ${FARAZSMS_PATTERN_CODE:-}
      FARAZSMS_FROM_NUMBER: ${FARAZSMS_FROM_NUMBER:-}
      FARAZSMS_PATTERN_PARAM: ${FARAZSMS_PATTERN_PARAM:-codeotp}
      WAITLIST_DB: /data/waitlist.sqlite3
      # The برنامک's bot token (ADR-0021): the Eitaayar panel's token —
      # the initData signature's key and sendMessage's credential.
      # Deploys carry it as a FILE on the volume (EITAA_BOT_TOKEN_FILE,
      # written by the deploy's docker exec) — the panel's token
      # contains `$` sequences and the env layer interpolates them, so
      # the raw bytes only survive on a filesystem path. The file wins
      # over EITAA_BOT_TOKEN; either unset, /eitaa/auth answers 503
      # and the page says so honestly.
      EITAA_BOT_TOKEN: ${EITAA_BOT_TOKEN:-}
      EITAA_BOT_TOKEN_FILE: /data/eitaa-bot-token
      # The server→user push (ADR-0021): opt-in, off by default —
      # Eita's daily message quota is not ours to spend.
      EITAA_PUSH_ENABLED: ${EITAA_PUSH_ENABLED:-}
      # The lecture sessions' recorded MP3s (the کتاب‌خوان's lecture
      # player): the read-only mount one level up, per the delivery
      # guide's method two.
      LECTURE_AUDIO_DIR: ${LECTURE_AUDIO_DIR:-}
      LECTURE_AUDIO_BASE_URL: ${LECTURE_AUDIO_BASE_URL:-}
    volumes:
      - session_quota:/data
      # The Book set's PDFs + page indexes (ADR-0007) and the committed
      # lecture audio (books/<id>/lectures/session_NN.mp3), served by
      # serve.py's /books routes. Default BOOKS_DIR resolves to /books —
      # ui/serve.py's parent — so the mount point matches the dev layout.
      - ./books:/books:ro
      # Optional Persian wav2vec2 artifact for exact audio focus.
      - ./models:/models:ro
      # The lecture sessions' recorded MP3s (the کتاب‌خوان's lecture
      # player): the heavy audio lives OUTSIDE the rsynced tree, one
      # level up — the deploy plants it there and LECTURE_AUDIO_DIR
      # points the routes at it. Unset dir, the routes answer 404 and
      # the player explains itself.
      - ../lecture-audio:/lecture-audio:ro
      # The page rasters' disk cache (ADR-0017): the render-cache bind
      # sits beside the books mount exactly where serve.py's default
      # BOOKS_DIR/../render-cache resolves, so a rebuild never re-renders
      # the pages a visitor already paid the wait for.
      - ./render-cache:/render-cache
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/livez')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cognee-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: cognee/cognee-ui:latest
    container_name: chat-with-books-ui
    profiles:
      - ui
    restart: unless-stopped
    environment:
      COGNEE_BACKEND_URL: ${COGNEE_BACKEND_URL:-}
    depends_on:
      cognee:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - cognee-network

networks:
  cognee-network:
    name: chat-with-books

volumes:
  postgres_data:
  cognee_data:
  cognee_system:
  session_quota:
  agent_data:
