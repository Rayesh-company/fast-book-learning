# The booksai vhost, both faces: port 80 serves the ACME challenge and
# the plain entry, 443 terminates Let's Encrypt for the SAME proxy —
# the mobile app's baked EXPO_PUBLIC_API_URL and the Eita برنامک's
# registered URL are https and ride this block. Installed by the
# fix-tls workflow (workflow_dispatch): it issues the cert through the
# webroot below when absent, copies this file over the box's existing
# booksai vhost, gates on `nginx -t`, and only then reloads.

server {
    listen 80;
    listen [::]:80;
    server_name booksai.rayesh-team.ir;

    # ACME stays on plain HTTP (the challenge is what BOOTSTRAPS the
    # certificate); everything else belongs to the TLS face.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2: the mobile face rides ~31 requests at boot; on HTTP/1.1
    # they queue six-per-connection down the slow Iran-to-box path,
    # and ALPN today offers only http/1.1. Multiplexing puts them all
    # on one connection. (The `listen … http2` form warns on nginx
    # ≥1.25 but keeps working; `nginx -t` in fix-tls gates the reload.)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name booksai.rayesh-team.ir;

    ssl_certificate /etc/letsencrypt/live/booksai.rayesh-team.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booksai.rayesh-team.ir/privkey.pem;

    # The UI's text answers gzip at the proxy too — belt under serve.py's
    # own gzip (already-encoded responses pass through untouched), so a
    # future route added without thinking about compression still ships
    # compressed down the Iran-to-box path where every KB is felt.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 600;
    gzip_vary on;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }
}
