<script>
  // The URL.parse ponyfill (2026-11-05): pdf.js >= 4.5 calls the static
  // URL.parse (Chrome 126+); older Android WebViews throw and the book
  // text never loads. Same semantics as the spec: null on failure.
  if (!URL.parse) URL.parse = function (url, base) {
    try { return base ? new URL(url, base) : new URL(url); }
    catch (e) { return null; }
  };
</script>

    if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) {
      Promise.all([
        import('/mobile/reticle.js'),
        import('/reticle.local.js').catch(() => ({})),
      ]).then(([{ reticle }, local]) => {
        reticle.connect({
          projectId: 'ui-a344e01c',
          url: 'ws://127.0.0.1:4400/reticle',
          token: local?.token
        });
      }).catch(e => console.error('[reticle] load error', e));
    }
  </script>
